<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Every registered manna board on this machine, live." />
  <title>manna / boards</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/index.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="prompt"><span class="prompt-mark">$</span><strong>manna</strong><span class="muted">serve --status</span></div>
    <div class="topbar-state" aria-live="polite">
      <span id="connection-mark" class="connection-mark">○</span>
      <span id="connection-label">connecting</span>
      <span class="separator">|</span>
      <span id="last-sync">waiting for state</span>
    </div>
  </header>
  <main>
    <section class="status-block">
      <p class="command">$ manna serve --status</p>
      <h1>BOARDS</h1>
      <p class="muted" id="summary-line">loading</p>
    </section>
    <section class="document-section">
      <div class="table-wrap"><table>
        <thead><tr><th scope="col">board</th><th scope="col">active</th><th scope="col">ready</th><th scope="col">blocked</th><th scope="col">decision</th><th scope="col">dream</th><th scope="col">done</th><th scope="col">drift</th><th scope="col">updated</th><th scope="col">path</th></tr></thead>
        <tbody id="boards-body"></tbody>
      </table></div>
      <p class="note">A board appears here after <code>agent-do manna serve</code> runs inside its project once, or after <code>agent-do manna serve --scan &lt;dir&gt;</code>.</p>
    </section>
    <footer class="footer"><p><span class="label">registry </span><strong id="registry-path"></strong></p></footer>
  </main>
</body>
</html>
