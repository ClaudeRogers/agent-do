<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPT OKLCH parser fixture</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px;
      color: oklch(92% 0.02 255);
      background: oklch(22% 0.03 255);
      font: 17px/1.5 system-ui, sans-serif;
    }
    main { max-width: 64ch; }
    h1 { font-size: 40px; line-height: 1.2; }
    .low-contrast { color: oklch(29% 0.02 255); }
    button {
      min-width: 144px;
      min-height: 48px;
      border: 2px solid oklch(76% 0.16 170);
      border-radius: 8px;
      color: oklch(18% 0.03 255);
      background: oklch(76% 0.16 170);
      font: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>OKLCH is measured, not guessed</h1>
    <p class="low-contrast">This deliberately unreadable sentence must produce a hard contrast failure.</p>
    <button type="button">Measured action</button>
  </main>
</body>
</html>
