<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPT violation ordering fixture</title>
  <style>
    body { margin: 0; padding: 32px; color: rgb(34 34 34); background: rgb(255 255 255); font-family: system-ui, sans-serif; }
    main { max-width: 60ch; }
    .failure { margin: 2px 0; color: rgb(235 235 235); background: rgb(255 255 255); font-size: 10px; line-height: 1.1; }
  </style>
</head>
<body>
  <main id="failures"><h1>Deliberate hard failures</h1></main>
  <script>
    const root = document.getElementById('failures');
    for (let index = 1; index <= 36; index += 1) {
      const paragraph = document.createElement('p');
      paragraph.className = 'failure';
      paragraph.textContent = `Unreadable sample ${index}`;
      root.appendChild(paragraph);
    }
  </script>
</body>
</html>
