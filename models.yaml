# models.yaml — source of truth for agent-do's own internal LLM calls.
# Generated templates and user-selected engines are intentionally out of scope.
# Validate with: agent-do models doctor
version: 1

roles:
  fast:
    chain:
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
    env: AGENT_DO_MODEL_FAST
  vision:
    chain:
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
    env: AGENT_DO_MODEL_VISION
  deep:
    chain:
      - claude-opus-4-8
      - claude-sonnet-5
    env: AGENT_DO_MODEL_DEEP

# Capability records below were read from Anthropic's complete /v1/models
# response on 2026-07-20. `agent-do models doctor` refreshes and verifies them.
models:
  claude-sonnet-5:
    provider: anthropic
    endpoint: messages
    modalities: [text, image, pdf]
    max_input_tokens: 1000000
    max_tokens: 128000
    capabilities:
      image_input: {supported: true}
      pdf_input: {supported: true}
      structured_outputs: {supported: true}
      thinking:
        supported: true
        types:
          adaptive: {supported: true}
          enabled: {supported: false}
      effort:
        supported: true
        low: {supported: true}
        medium: {supported: true}
        high: {supported: true}
        xhigh: {supported: true}
        max: {supported: true}
    generation:
      thinking: {type: adaptive, display: omitted}
      output_config: {effort: max}
  claude-opus-4-8:
    provider: anthropic
    endpoint: messages
    modalities: [text, image, pdf]
    max_input_tokens: 1000000
    max_tokens: 128000
    capabilities:
      image_input: {supported: true}
      pdf_input: {supported: true}
      structured_outputs: {supported: true}
      thinking:
        supported: true
        types:
          adaptive: {supported: true}
          enabled: {supported: false}
      effort:
        supported: true
        low: {supported: true}
        medium: {supported: true}
        high: {supported: true}
        xhigh: {supported: true}
        max: {supported: true}
    generation:
      thinking: {type: adaptive, display: omitted}
      output_config: {effort: max}
  claude-haiku-4-5-20251001:
    provider: anthropic
    endpoint: messages
    modalities: [text, image, pdf]
    max_input_tokens: 200000
    max_tokens: 64000
    capabilities:
      image_input: {supported: true}
      pdf_input: {supported: true}
      structured_outputs: {supported: true}
      thinking:
        supported: true
        types:
          adaptive: {supported: false}
          enabled: {supported: true}
      effort: {supported: false}
    generation:
      thinking: {type: enabled, budget_tokens: 1024}

retired:
  anthropic:
    - claude-3-sonnet-20240229
    - claude-sonnet-4-20250514
