# Contracts gate — grandfather baseline.
#
# Tools listed here predate the contracts requirement and are temporarily
# exempt from declaring a `contracts:` block in registry.yaml.
#
# THE RATCHET ONLY TIGHTENS:
#   - A new tool may NEVER be added to this list. New registry entries must
#     declare contracts (enforced by tests/test_contracts_gate.py and
#     `agent-do harness contracts validate`).
#   - When a tool gains a contracts block, REMOVE it from this list in the
#     same commit — a stale entry fails the gate.
#   - When this list is empty, delete the file and flip the gate to --strict.
#
